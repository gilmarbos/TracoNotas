name: Gerar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar projeto
        run: |
          unzip -o TracoNotas.zip -d src
          DIR=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "Projeto em: $DIR"
          echo "DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: |
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - name: Procurar APK
        run: |
          mkdir -p saida
          find . -name "*.apk" -not -path "./saida/*" -exec cp {} saida/ \;
          ls -la saida
      - uses: actions/upload-artifact@v4
        with:
          name: TracoNotas-apk
          path: saida/*.apk
          if-no-files-found: error
